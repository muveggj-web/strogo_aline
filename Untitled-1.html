<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Привет</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050a05;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(34,197,94,0.06);
      filter: blur(120px);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; scale: 1; }
      50% { opacity: 1; scale: 1.3; }
    }
    h1 {
      position: relative;
      font-family: 'Inter', sans-serif;
      font-size: clamp(48px, 12vw, 110px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      text-align: center;
      color: transparent;
      background: linear-gradient(180deg, #ffffff 20%, #4ade80 80%);
      -webkit-background-clip: text;
      background-clip: text;
      animation: breathe 5s ease-in-out infinite alternate;
    }
    h1::after {
      content: 'Привет, вонючка';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #4ade80 20%, #059669 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: blur(30px);
      opacity: 0;
      animation: shadow-glow 5s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      0%   { filter: drop-shadow(0 0 30px rgba(34,197,94,0.1)) brightness(0.9); }
      100% { filter: drop-shadow(0 0 80px rgba(34,197,94,0.4)) brightness(1.1); }
    }
    @keyframes shadow-glow {
      0%   { opacity: 0.2; }
      100% { opacity: 0.7; }
    }
  </style>
</head>
<body>
  <h1>Привет, вонючка</h1>
</body>
</html>
